<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self';"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Brizo - Incognito</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        overflow: hidden;
        background: #1e211f;
        color: #eef1ee;
        font: 13px "HarmonyOS Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .link-tabbar { display: none; }
      .toolbar {
        height: 58px;
        padding: 0 14px 0 82px;
        display: flex;
        align-items: center;
        gap: 8px;
        border-bottom: 1px solid #393d3a;
        -webkit-app-region: drag;
      }
      button, input { font: inherit; }
      button, form { -webkit-app-region: no-drag; }
      button {
        height: 30px;
        padding: 0 10px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: #d9ddda;
        cursor: pointer;
      }
      button:hover, button:focus-visible {
        background: #343936;
        outline: none;
      }
      button:disabled { opacity: 0.35; pointer-events: none; }
      form {
        min-width: 180px;
        max-width: 680px;
        height: 34px;
        flex: 1;
        display: flex;
        align-items: center;
        margin-left: 5px;
        padding: 0 12px;
        border-radius: 9px;
        background: #303431;
      }
      input {
        width: 100%;
        border: 0;
        outline: 0;
        background: transparent;
        color: #f5f7f5;
      }
      .badge {
        margin-left: auto;
        color: #aab3ac;
        font-size: 12px;
        white-space: nowrap;
      }
      body.link-window {
        background: #f1e7e1;
        color: #2e4032;
      }
      body.link-window .link-tabbar {
        height: 34px;
        padding: 0 12px 0 76px;
        display: flex;
        align-items: flex-end;
        gap: 12px;
        background: #f1e7e1;
        -webkit-app-region: drag;
      }
      .link-brand {
        height: 30px;
        display: flex;
        align-items: center;
        color: #8b744d;
        font-size: 11px;
        letter-spacing: .16em;
        white-space: nowrap;
      }
      .link-single-tab {
        min-width: 150px;
        max-width: 360px;
        height: 30px;
        padding: 0 14px;
        display: flex;
        align-items: center;
        border-radius: 11px 11px 0 0;
        background: #faf9f6;
        box-shadow: 0 -1px 0 rgba(255,255,255,.65), 0 1px 4px rgba(90,70,50,.06);
        color: #3e463f;
        -webkit-app-region: no-drag;
      }
      #single-tab-title {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      body.link-window .toolbar {
        height: 52px;
        padding: 0 14px;
        border-bottom: 1px solid rgba(120,80,40,.08);
        background: #faf9f6;
      }
      body.link-window button {
        color: #5f665f;
      }
      body.link-window button:hover,
      body.link-window button:focus-visible {
        background: rgba(95,102,95,.1);
      }
      body.link-window form {
        max-width: none;
        background: rgba(241,231,225,.72);
        box-shadow: inset 0 0 0 1px rgba(120,80,40,.07);
      }
      body.link-window input {
        color: #3e463f;
        font-size: 12px;
        font-style: italic;
      }
      body.link-window .badge { display: none; }
    </style>
  </head>
  <body>
    <div class="link-tabbar" aria-label="Brizo 单标签窗口">
      <div class="link-brand">BRIZO</div>
      <div class="link-single-tab" role="tab" aria-selected="true">
        <span id="single-tab-title">新标签页</span>
      </div>
    </div>
    <header class="toolbar">
      <button id="back" type="button">Back</button>
      <button id="forward" type="button">Forward</button>
      <button id="reload" type="button">Reload</button>
      <form id="address-form">
        <input id="address" aria-label="Address" autocomplete="off" spellcheck="false">
      </form>
      <span class="badge">Private window</span>
    </header>
    <script src="./incognito-renderer.js"></script>
  </body>
</html>
